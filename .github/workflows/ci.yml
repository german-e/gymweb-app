# Integración continua: en cada push y pull request compila, corre las pruebas,
# revisa paquetes con vulnerabilidades conocidas y construye la imagen Docker.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    name: Compilación y pruebas
    runs-on: ubuntu-latest
    # PostgreSQL para las pruebas (mismo motor que producción)
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: gymcore
          POSTGRES_PASSWORD: gymcore_ci
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gymcore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      GYMCORE_PRUEBAS_POSTGRES: Host=localhost;Port=5432;Username=gymcore;Password=gymcore_ci;Database=postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurar
        run: dotnet restore GymCore.sln

      - name: Compilar
        run: dotnet build GymCore.sln -c Release --no-restore

      - name: Pruebas
        run: dotnet test GymCore.sln -c Release --no-build --logger "console;verbosity=normal"

      - name: Migraciones al día con el modelo
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes \
            --project src/GymCore.Infraestructura --startup-project src/GymCore.Web --no-build --configuration Release

      - name: Paquetes con vulnerabilidades conocidas
        run: |
          dotnet list GymCore.sln package --vulnerable --include-transitive | tee vulnerables.txt
          if grep -q "has the following vulnerable packages" vulnerables.txt; then
            echo "::error::Hay paquetes con vulnerabilidades conocidas (ver el detalle arriba)"
            exit 1
          fi

  imagen:
    name: Imagen Docker
    needs: pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen
        run: docker build -t gymcore:${{ github.sha }} .
